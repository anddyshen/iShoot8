services:
  ishoot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ishoot-app
    restart: unless-stopped
    ports:
      # 宿主机端口与容器端口均统一使用 6666
      - "6666:6666"
    volumes:
      # 持久化数据目录（SQLite数据库与系统配置）
      - ./instance:/app/instance
      # 持久化用户上传的文件与头像
      - ./uploads:/app/uploads
      # 持久化设置与数据库备份文件
      - ./backups:/app/backups
    environment:
      - FLASK_SECRET_KEY=change_this_to_a_random_secure_secret_key
      - ADMIN_PASSWORD=admin123
      - ADMIN_ROUTE_PREFIX=admin_xyz12
      - TZ=Asia/Shanghai
