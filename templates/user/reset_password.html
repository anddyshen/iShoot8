{% extends "base.html" %}
{% block title %}重置密码{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0"><i class="bi bi-key"></i> 重置密码</h4>
            </div>
            <div class="card-body">
                <p class="text-muted">请输入您的新密码，密码需满足以下要求：</p>
                <ul class="text-muted small" id="passwordRequirements">
                    <li id="req-length">至少8个字符</li>
                    <li id="req-upper">包含至少一个大写字母</li>
                    <li id="req-lower">包含至少一个小写字母</li>
                    <li id="req-digit">包含至少一个数字</li>
                    <li id="req-special">包含至少一个特殊字符（!@#$%^&* 等）</li>
                </ul>
                <form method="POST" action="{{ url_for('auth_routes.reset_password', token=token) }}">
                    <div class="mb-3">
                        <label for="new_password" class="form-label">新密码</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="new_password" name="new_password" 
                                   placeholder="请输入新密码" required minlength="8"
                                   autocomplete="new-password">
                            <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <div class="mt-2">
                            <div class="progress" style="height: 6px;">
                                <div id="passwordStrength" class="progress-bar" role="progressbar" 
                                     style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                            </div>
                            <small id="passwordStrengthText" class="text-muted">请输入密码</small>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">确认新密码</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" 
                                   placeholder="请再次输入新密码" required autocomplete="new-password">
                        </div>
                        <div id="passwordMatch" class="form-text"></div>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success" id="submitBtn" disabled>
                            <i class="bi bi-check-circle"></i> 重置密码
                        </button>
                        <a href="{{ url_for('auth_routes.login') }}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> 返回登录
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// 密码强度检测
function checkPasswordStrength(password) {
    let score = 0;
    const requirements = {
        length: password.length >= 8,
        upper: /[A-Z]/.test(password),
        lower: /[a-z]/.test(password),
        digit: /\d/.test(password),
        special: /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(password),
    };
    
    // 更新UI指示
    document.getElementById('req-length').className = requirements.length ? 'text-success' : 'text-muted';
    document.getElementById('req-upper').className = requirements.upper ? 'text-success' : 'text-muted';
    document.getElementById('req-lower').className = requirements.lower ? 'text-success' : 'text-muted';
    document.getElementById('req-digit').className = requirements.digit ? 'text-success' : 'text-muted';
    document.getElementById('req-special').className = requirements.special ? 'text-success' : 'text-muted';
    
    // 计算分数
    if (password.length >= 8) score += 20;
    if (password.length >= 12) score += 10;
    if (requirements.upper) score += 15;
    if (requirements.lower) score += 15;
    if (requirements.digit) score += 15;
    if (requirements.special) score += 15;
    if (requirements.upper && requirements.lower) score += 5;
    if (requirements.digit && requirements.special) score += 5;
    
    // 更新进度条
    const bar = document.getElementById('passwordStrength');
    const text = document.getElementById('passwordStrengthText');
    bar.style.width = Math.min(100, score) + '%';
    
    if (score < 30) {
        bar.className = 'progress-bar bg-danger';
        text.textContent = '弱 - 密码强度不足';
    } else if (score < 60) {
        bar.className = 'progress-bar bg-warning';
        text.textContent = '中等 - 可以接受';
    } else if (score < 80) {
        bar.className = 'progress-bar bg-info';
        text.textContent = '强 - 密码强度良好';
    } else {
        bar.className = 'progress-bar bg-success';
        text.textContent = '非常强 - 密码非常安全';
    }
    
    // 返回是否满足所有要求
    return requirements.length && requirements.upper && requirements.lower && requirements.digit && requirements.special;
}

// 密码显示切换
document.getElementById('togglePassword').addEventListener('click', function() {
    const input = document.getElementById('new_password');
    const icon = this.querySelector('i');
    if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'bi bi-eye-slash';
    } else {
        input.type = 'password';
        icon.className = 'bi bi-eye';
    }
});

// 实时检查
document.getElementById('new_password').addEventListener('input', function() {
    const isValid = checkPasswordStrength(this.value);
    checkPasswordsMatch();
});

document.getElementById('confirm_password').addEventListener('input', checkPasswordsMatch);

function checkPasswordsMatch() {
    const pwd = document.getElementById('new_password').value;
    const confirm = document.getElementById('confirm_password').value;
    const matchEl = document.getElementById('passwordMatch');
    const submitBtn = document.getElementById('submitBtn');
    
    if (!confirm) {
        matchEl.textContent = '';
        matchEl.className = 'form-text';
        submitBtn.disabled = true;
        return;
    }
    
    const pwdValid = checkPasswordStrength(pwd);
    
    if (pwd === confirm) {
        matchEl.textContent = '✅ 密码匹配';
        matchEl.className = 'form-text text-success';
        submitBtn.disabled = !pwdValid;
    } else {
        matchEl.textContent = '❌ 密码不匹配';
        matchEl.className = 'form-text text-danger';
        submitBtn.disabled = true;
    }
}

// 页面加载时初始化
document.addEventListener('DOMContentLoaded', function() {
    checkPasswordStrength('');
});
</script>
{% endblock %}
