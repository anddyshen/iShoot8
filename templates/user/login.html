{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="bi bi-box-arrow-in-right"></i> 用户登录</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('auth_routes.login') }}">
                    <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">用户名</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" name="username" 
                                   placeholder="请输入用户名" required autocomplete="username">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">密码</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" 
                                   placeholder="请输入密码" required autocomplete="current-password">
                        </div>
                    </div>
                    <div id="captchaSection" class="mb-3" style="display:none;">
                        <label for="captcha" class="form-label">验证码</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                            <input type="text" class="form-control" id="captcha" name="captcha" 
                                   placeholder="输入验证码结果" autocomplete="off">
                            <button class="btn btn-outline-secondary" type="button" id="refreshCaptcha" title="刷新验证码">
                                <i class="bi bi-arrow-clockwise"></i>
                            </button>
                        </div>
                        <div class="mt-2 text-center" id="captchaImageContainer">
                            <img id="captchaImage" src="" alt="验证码" style="border-radius: 4px; cursor: pointer;" onclick="refreshCaptcha()">
                        </div>
                        <div class="form-text text-muted">请输入图中算术题的结果</div>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="remember" name="remember">
                        <label class="form-check-label" for="remember">记住我</label>
                    </div>
                    <div class="mb-3 text-end">
                        <a href="{{ url_for('auth_routes.forgot_password') }}" class="text-decoration-none small">
                            <i class="bi bi-question-circle"></i> 忘记密码？
                        </a>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-box-arrow-in-right"></i> 登录
                        </button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center">
                <span>还没有账号？</span>
                <a href="{{ url_for('auth_routes.register') }}">立即注册</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// 验证码刷新函数
function refreshCaptcha() {
    var img = document.getElementById('captchaImage');
    if (img) {
        img.src = '{{ url_for("auth_routes.captcha_image") }}?t=' + new Date().getTime();
    }
}

// 检查是否需要验证码
function checkNeedCaptcha() {
    var username = document.getElementById('username').value;
    if (!username) return;
    
    fetch('{{ url_for("auth_routes.check_captcha_needed") }}', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username: username})
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
        var section = document.getElementById('captchaSection');
        if (data.needs_captcha) {
            section.style.display = 'block';
            refreshCaptcha();
        } else {
            section.style.display = 'none';
        }
    })
    .catch(function() {});
}

// 页面加载和用户名输入时检查
document.addEventListener('DOMContentLoaded', checkNeedCaptcha);
document.getElementById('username').addEventListener('blur', checkNeedCaptcha);
document.getElementById('refreshCaptcha').addEventListener('click', refreshCaptcha);
</script>
{% endblock %}
