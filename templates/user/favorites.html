{% extends "base.html" %}
{% block title %}心仪号码{% endblock %}
{% block content %}
<style>
.ball-selector {
    border: 1px solid #dee2e6;
    border-radius: 8px;
    padding: 10px;
    background: #f8f9fa;
}
.ball-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
}
.selector-ball {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    font-size: 13px;
    font-weight: bold;
    transition: all 0.2s ease;
    user-select: none;
}
.selector-ball.red {
    background: #fff;
    color: #dc3545;
    border-color: #dc3545;
}
.selector-ball.red:hover {
    background: #fce4e4;
}
.selector-ball.red.selected {
    background: #dc3545;
    color: #fff;
    border-color: #dc3545;
    box-shadow: 0 2px 6px rgba(220, 53, 69, 0.4);
}
.selector-ball.blue {
    background: #fff;
    color: #0d6efd;
    border-color: #0d6efd;
}
.selector-ball.blue:hover {
    background: #e4edfc;
}
.selector-ball.blue.selected {
    background: #0d6efd;
    color: #fff;
    border-color: #0d6efd;
    box-shadow: 0 2px 6px rgba(13, 110, 253, 0.4);
}
.selector-ball:active {
    transform: scale(0.9);
}
.selected-display {
    font-size: 0.9rem;
}
</style>
<div class="card shadow">
    <div class="card-header bg-danger text-white d-flex justify-content-between align-items-center">
        <h4 class="mb-0"><i class="bi bi-heart"></i> 心仪号码</h4>
        <div class="d-flex align-items-center gap-2">
            <button class="btn btn-sm btn-outline-light d-none" id="batchDeleteBtn" onclick="batchDeleteFavorites()">
                <i class="bi bi-trash"></i> 批量删除
            </button>
            <span class="badge bg-light text-dark" id="countBadge">0 个</span>
            <button class="btn btn-sm btn-light" onclick="refreshFavorites()" title="刷新数据">
                <i class="bi bi-arrow-clockwise"></i>
            </button>
        </div>
    </div>
    <div class="card-body">
        <div class="row mb-3">
            <div class="col-md-6">
                <p class="text-muted">
                    <i class="bi bi-info-circle"></i> 
                    在号码筛选页面可以将心仪的号码保存到此，方便随时查看和使用。
                </p>
            </div>
            <div class="col-md-6 text-end">
                <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#addFavoriteModal">
                    <i class="bi bi-plus-circle"></i> 添加心仪号码
                </button>
            </div>
        </div>

        <!-- 彩种筛选标签 -->
        <div class="btn-group mb-3" role="group" id="filterTabs">
            <button type="button" class="btn btn-outline-secondary active" data-filter="all" onclick="switchFilter('all')">全部</button>
            <button type="button" class="btn btn-outline-primary" data-filter="ssq" onclick="switchFilter('ssq')">双色球</button>
            <button type="button" class="btn btn-outline-success" data-filter="dlt" onclick="switchFilter('dlt')">大乐透</button>
        </div>

        <div id="favoritesList">
            <div class="text-center text-muted py-5">
                <i class="bi bi-heartbreak display-1"></i>
                <p class="mt-3">暂无心仪号码</p>
                <a href="{{ url_for('routes.prediction') }}" class="btn btn-primary">
                    <i class="bi bi-search"></i> 去筛选号码
                </a>
            </div>
        </div>

        <!-- 分页控件 -->
        <nav id="paginationNav" style="display:none;" class="mt-3">
            <ul class="pagination justify-content-center">
                <li class="page-item" id="prevPageBtn">
                    <a class="page-link" href="#" onclick="goPage(-1)">上一页</a>
                </li>
                <li class="page-item disabled"><a class="page-link" id="pageInfo" href="#">1/1</a></li>
                <li class="page-item" id="nextPageBtn">
                    <a class="page-link" href="#" onclick="goPage(1)">下一页</a>
                </li>
            </ul>
        </nav>
    </div>
</div>

<!-- 添加心仪号码弹窗 -->
<div class="modal fade" id="addFavoriteModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-heart"></i> 添加心仪号码</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="addFavoriteForm">
                    <div class="mb-3">
                        <label class="form-label">彩种</label>
                        <div class="btn-group" role="group" id="favLotteryTypeGroup">
                            <button type="button" class="btn btn-outline-primary active" data-type="ssq" onclick="switchFavLotteryType('ssq')">双色球</button>
                            <button type="button" class="btn btn-outline-success" data-type="dlt" onclick="switchFavLotteryType('dlt')">大乐透</button>
                        </div>
                    </div>

                    <!-- 红球/前区号码选择器 -->
                    <div class="mb-3">
                        <label class="form-label" id="favRedLabel">红球号码（点击选择，支持复式，不限数量）</label>
                        <div class="ball-selector" id="favRedBallSelector">
                            <div class="ball-grid" id="favRedBallGrid">
                                <!-- 由JS动态生成 -->
                            </div>
                        </div>
                    </div>

                    <!-- 蓝球/后区号码选择器 -->
                    <div class="mb-3">
                        <label class="form-label" id="favBlueLabel">蓝球号码（点击选择，支持复式，不限数量）</label>
                        <div class="ball-selector" id="favBlueBallSelector">
                            <div class="ball-grid" id="favBlueBallGrid">
                                <!-- 由JS动态生成 -->
                            </div>
                        </div>
                    </div>

                    <!-- 已选号码显示 -->
                    <div class="mb-3">
                        <div class="selected-display p-2 bg-light rounded">
                            <span class="text-muted">已选：</span>
                            <span id="favSelectedRedDisplay" class="text-danger fw-bold me-2">红球：未选择</span>
                            <span id="favSelectedBlueDisplay" class="text-primary fw-bold">蓝球：未选择</span>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">备注（选填）</label>
                        <input type="text" class="form-control" id="favNote" placeholder="如：守号、机选等">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-danger" onclick="addFavorite()">
                    <i class="bi bi-heart"></i> 添加
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
/** 北京时间格式化：手动解析 ISO 字符串 "2026-05-28T00:55:00" 强制显示北京时间 */
function formatBeijingTime(dateStr) {
    if (!dateStr) return '-';
    // 去除末尾的 Z 或 +08:00 时区标识（如果有）
    let clean = dateStr.replace(/[Zz]$/, '').replace(/[+-]\d{2}:\d{2}$/, '');
    // 格式: "2026-05-28T00:55:00" 或 "2026-05-28T00:55:00.123456"
    const parts = clean.split('T');
    if (parts.length !== 2) return dateStr;
    return parts[0] + ' ' + parts[1].split('.')[0];
}

// 当前状态
let currentFilter = 'all';
let currentPage = 1;
const perPage = 20;
let totalPages = 1;
let selectedIds = new Set();

function switchFilter(filter) {
    currentFilter = filter;
    currentPage = 1;
    selectedIds.clear();
    updateBatchDeleteBtn();
    // 更新按钮高亮
    document.querySelectorAll('#filterTabs .btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`#filterTabs .btn[data-filter="${filter}"]`).classList.add('active');
    loadFavorites();
}

function goPage(delta) {
    const newPage = currentPage + delta;
    if (newPage < 1 || newPage > totalPages) return;
    currentPage = newPage;
    selectedIds.clear();
    updateBatchDeleteBtn();
    loadFavorites();
}

function toggleSelectAll() {
    const selectAllCheckbox = document.getElementById('selectAll');
    const isChecked = selectAllCheckbox.checked;
    document.querySelectorAll('.fav-checkbox').forEach(cb => {
        cb.checked = isChecked;
        const id = parseInt(cb.dataset.id);
        if (isChecked) {
            selectedIds.add(id);
        } else {
            selectedIds.delete(id);
        }
    });
    updateBatchDeleteBtn();
}

function toggleSelect(id) {
    const cb = document.querySelector(`.fav-checkbox[data-id="${id}"]`);
    if (cb.checked) {
        selectedIds.add(id);
    } else {
        selectedIds.delete(id);
        // 如果取消了某个勾选，取消全选
        document.getElementById('selectAll').checked = false;
    }
    updateBatchDeleteBtn();
}

function updateBatchDeleteBtn() {
    const btn = document.getElementById('batchDeleteBtn');
    if (selectedIds.size > 0) {
        btn.classList.remove('d-none');
        btn.innerHTML = `<i class="bi bi-trash"></i> 批量删除 (${selectedIds.size})`;
    } else {
        btn.classList.add('d-none');
    }
}

async function batchDeleteFavorites() {
    if (selectedIds.size === 0) return;
    if (!confirm(`确定删除选中的 ${selectedIds.size} 条心仪号码？`)) return;
    
    try {
        const resp = await fetch('/auth/api/favorites/batch_delete', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ids: Array.from(selectedIds)}),
        });
        if (resp.ok) {
            selectedIds.clear();
            updateBatchDeleteBtn();
            loadFavorites();
        } else {
            const result = await resp.json();
            alert('删除失败：' + (result.error || '未知错误'));
        }
    } catch (err) {
        alert('网络错误');
    }
}

async function loadFavorites() {
    try {
        const url = `/auth/api/favorites?page=${currentPage}&per_page=${perPage}&lottery_type=${currentFilter}`;
        const resp = await fetch(url);
        if (!resp.ok) throw new Error('获取失败');
        const data = await resp.json();
        const container = document.getElementById('favoritesList');
        const badge = document.getElementById('countBadge');
        
        // 更新分页状态
        totalPages = data.total_pages || 1;
        const paginationNav = document.getElementById('paginationNav');
        const pageInfo = document.getElementById('pageInfo');
        
        if (totalPages > 1) {
            paginationNav.style.display = '';
            pageInfo.textContent = `${data.page}/${totalPages}`;
            document.getElementById('prevPageBtn').className = 'page-item' + (data.page <= 1 ? ' disabled' : '');
            document.getElementById('nextPageBtn').className = 'page-item' + (data.page >= totalPages ? ' disabled' : '');
        } else {
            paginationNav.style.display = 'none';
        }
        
        if (!data.favorites || data.favorites.length === 0) {
            container.innerHTML = `
                <div class="text-center text-muted py-5">
                    <i class="bi bi-heartbreak display-1"></i>
                    <p class="mt-3">暂无心仪号码</p>
                    <a href="{{ url_for('routes.prediction') }}" class="btn btn-primary">
                        <i class="bi bi-search"></i> 去筛选号码
                    </a>
                </div>`;
            badge.textContent = '0 个';
            return;
        }
        
        badge.textContent = data.total + ' 个';
        let html = '<div class="table-responsive"><table class="table table-hover">';
        html += `<thead class="table-light">
            <tr>
                <th style="width:40px;">
                    <input type="checkbox" id="selectAll" onchange="toggleSelectAll()" class="form-check-input">
                </th>
                <th>#</th>
                <th>彩种</th>
                <th>号码</th>
                <th>添加时间</th>
                <th>备注</th>
                <th>操作</th>
            </tr>
        </thead><tbody>`;
        
        const startIdx = (data.page - 1) * data.per_page;
        data.favorites.forEach((item, idx) => {
            // Format balls display
            let ballsHtml = '';
            if (item.red_balls) {
                const reds = item.red_balls.split(',').map(n => parseInt(n));
                const blues = item.blue_balls ? item.blue_balls.split(',').map(n => parseInt(n)) : [];
                ballsHtml = reds.map(n => `<span class="ball ball-red" style="display:inline-block;width:28px;height:28px;line-height:28px;border-radius:50%;text-align:center;background:#ff6b6b;color:#fff;font-size:11px;margin:1px;">${String(n).padStart(2, '0')}</span>`).join('');
                ballsHtml += blues.map(n => `<span class="ball ball-blue" style="display:inline-block;width:28px;height:28px;line-height:28px;border-radius:50%;text-align:center;background:#339af0;color:#fff;font-size:11px;margin:1px;">${String(n).padStart(2, '0')}</span>`).join('');
            }
            
            // 备注显示与编辑
            const noteText = item.note || '';
            
            html += `<tr>
                <td>
                    <input type="checkbox" class="form-check-input fav-checkbox" data-id="${item.id}" onchange="toggleSelect(${item.id})">
                </td>
                <td>${startIdx + idx + 1}</td>
                <td><span class="badge bg-${item.lottery_type === 'ssq' ? 'primary' : 'success'}">${item.lottery_type === 'ssq' ? '双色球' : '大乐透'}</span></td>
                <td>${ballsHtml || item.combination || '-'}</td>
                <td>${formatBeijingTime(item.created_at)}</td>
                <td>
                    <span id="note_text_${item.id}">${noteText || '-'}</span>
                    <span id="note_edit_group_${item.id}" style="display:none;">
                        <input type="text" id="note_input_${item.id}" value="${noteText}" class="form-control form-control-sm" style="display:inline-block;width:120px;">
                        <button class="btn btn-sm btn-outline-success" onclick="saveNote(${item.id})" style="padding:0 6px;"><i class="bi bi-check-lg"></i></button>
                        <button class="btn btn-sm btn-outline-secondary" onclick="cancelEditNote(${item.id})" style="padding:0 6px;"><i class="bi bi-x-lg"></i></button>
                    </span>
                    <button class="btn btn-sm btn-outline-info ms-1" id="note_btn_${item.id}" onclick="toggleEditNote(${item.id})" style="padding:0 8px;font-size:12px;">
                        <i class="bi bi-pencil"></i>
                    </button>
                </td>
                <td>
                    <button class="btn btn-sm btn-outline-danger" onclick="removeFavorite(${item.id})">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            </tr>`;
        });
        
        html += '</tbody></table></div>';
        container.innerHTML = html;
    } catch (err) {
        console.error(err);
    }
}

async function removeFavorite(id) {
    if (!confirm('确定删除此心仪号码？')) return;
    try {
        const resp = await fetch('/auth/api/favorites/' + id, { method: 'DELETE' });
        if (resp.ok) {
            selectedIds.delete(id);
            updateBatchDeleteBtn();
            loadFavorites();
        } else {
            alert('删除失败');
        }
    } catch (err) {
        alert('网络错误');
    }
}

function toggleEditNote(id) {
    const textSpan = document.getElementById('note_text_' + id);
    const editGroup = document.getElementById('note_edit_group_' + id);
    const btn = document.getElementById('note_btn_' + id);
    
    if (editGroup.style.display === 'none') {
        // 切换到编辑模式
        textSpan.style.display = 'none';
        editGroup.style.display = 'inline-block';
        document.getElementById('note_input_' + id).focus();
        btn.innerHTML = '<i class="bi bi-x-lg"></i>';
        btn.className = 'btn btn-sm btn-outline-secondary ms-1';
    } else {
        // 取消编辑
        cancelEditNote(id);
    }
}

function cancelEditNote(id) {
    const textSpan = document.getElementById('note_text_' + id);
    const editGroup = document.getElementById('note_edit_group_' + id);
    const btn = document.getElementById('note_btn_' + id);
    
    textSpan.style.display = 'inline';
    editGroup.style.display = 'none';
    btn.innerHTML = '<i class="bi bi-pencil"></i>';
    btn.className = 'btn btn-sm btn-outline-info ms-1';
}

async function saveNote(id) {
    const input = document.getElementById('note_input_' + id);
    const newNote = input.value.trim();
    
    try {
        const resp = await fetch('/auth/api/favorites/' + id, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({note: newNote}),
        });
        const result = await resp.json();
        if (resp.ok) {
            const textSpan = document.getElementById('note_text_' + id);
            textSpan.textContent = newNote || '-';
            cancelEditNote(id);
        } else {
            alert('保存失败：' + (result.error || '未知错误'));
        }
    } catch (err) {
        alert('网络错误，请重试');
    }
}

async function refreshFavorites() {
    await loadFavorites();
}

// ========== 心仪号码添加弹窗 - 号码选择器逻辑 ==========

let favSelectedRedBalls = new Set();
let favSelectedBlueBalls = new Set();

function buildFavBallSelector(containerId, count, type) {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.innerHTML = '';
    for (let i = 1; i <= count; i++) {
        const ball = document.createElement('div');
        ball.className = `selector-ball ${type}`;
        ball.textContent = String(i).padStart(2, '0');
        ball.dataset.num = i;
        ball.onclick = function() { toggleFavBall(this, type); };
        container.appendChild(ball);
    }
}

function toggleFavBall(el, type) {
    const num = parseInt(el.dataset.num);
    if (type === 'red') {
        if (favSelectedRedBalls.has(num)) {
            favSelectedRedBalls.delete(num);
            el.classList.remove('selected');
        } else {
            favSelectedRedBalls.add(num);
            el.classList.add('selected');
        }
    } else if (type === 'blue') {
        if (favSelectedBlueBalls.has(num)) {
            favSelectedBlueBalls.delete(num);
            el.classList.remove('selected');
        } else {
            favSelectedBlueBalls.add(num);
            el.classList.add('selected');
        }
    }
    updateFavSelectedDisplay();
}

function updateFavSelectedDisplay() {
    const redArr = Array.from(favSelectedRedBalls).sort((a, b) => a - b);
    const blueArr = Array.from(favSelectedBlueBalls).sort((a, b) => a - b);
    
    const redDisplay = document.getElementById('favSelectedRedDisplay');
    const blueDisplay = document.getElementById('favSelectedBlueDisplay');
    
    if (redArr.length > 0) {
        redDisplay.innerHTML = '红球：<span class="text-danger">' + redArr.map(n => String(n).padStart(2, '0')).join(', ') + '</span>';
    } else {
        redDisplay.innerHTML = '红球：<span class="text-muted">未选择</span>';
    }
    
    if (blueArr.length > 0) {
        blueDisplay.innerHTML = '蓝球：<span class="text-primary">' + blueArr.map(n => String(n).padStart(2, '0')).join(', ') + '</span>';
    } else {
        blueDisplay.innerHTML = '蓝球：<span class="text-muted">未选择</span>';
    }
}

function resetFavBallSelectors() {
    favSelectedRedBalls.clear();
    favSelectedBlueBalls.clear();
    document.querySelectorAll('#favRedBallGrid .selector-ball').forEach(el => el.classList.remove('selected'));
    document.querySelectorAll('#favBlueBallGrid .selector-ball').forEach(el => el.classList.remove('selected'));
    updateFavSelectedDisplay();
}

function initFavBallSelectors(lotteryType) {
    if (lotteryType === 'ssq') {
        document.getElementById('favRedLabel').textContent = '红球号码（点击选择，支持复式，不限数量，1-33）';
        document.getElementById('favBlueLabel').textContent = '蓝球号码（点击选择，支持复式，不限数量，1-16）';
        buildFavBallSelector('favRedBallGrid', 33, 'red');
        buildFavBallSelector('favBlueBallGrid', 16, 'blue');
    } else {
        document.getElementById('favRedLabel').textContent = '前区号码（点击选择，支持复式，不限数量，1-35）';
        document.getElementById('favBlueLabel').textContent = '后区号码（点击选择，支持复式，不限数量，1-12）';
        buildFavBallSelector('favRedBallGrid', 35, 'red');
        buildFavBallSelector('favBlueBallGrid', 12, 'blue');
    }
    resetFavBallSelectors();
}

async function addFavorite() {
    const redArr = Array.from(favSelectedRedBalls).sort((a, b) => a - b);
    const blueArr = Array.from(favSelectedBlueBalls).sort((a, b) => a - b);
    const lotteryType = getFavLotteryType();
    
    // 检查号码数量是否满足最低要求（复式多余没关系）
    if (lotteryType === 'ssq') {
        if (redArr.length < 6) {
            alert('双色球至少选择6个红球号码（当前选了' + redArr.length + '个）');
            return;
        }
        if (blueArr.length < 1) {
            alert('双色球至少选择1个蓝球号码（当前选了' + blueArr.length + '个）');
            return;
        }
    } else if (lotteryType === 'dlt') {
        if (redArr.length < 5) {
            alert('大乐透至少选择5个前区号码（当前选了' + redArr.length + '个）');
            return;
        }
        if (blueArr.length < 2) {
            alert('大乐透至少选择2个后区号码（当前选了' + blueArr.length + '个）');
            return;
        }
    }
    
    const data = {
        lottery_type: lotteryType,
        red_balls: redArr.join(','),
        blue_balls: blueArr.join(','),
        note: document.getElementById('favNote').value.trim(),
    };
    
    try {
        const resp = await fetch('/auth/api/favorites', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data),
        });
        const result = await resp.json();
        if (resp.ok) {
            const modal = bootstrap.Modal.getInstance(document.getElementById('addFavoriteModal'));
            modal.hide();
            resetFavBallSelectors();
            document.getElementById('favNote').value = '';
            loadFavorites();
        } else {
            alert('错误：' + result.error);
        }
    } catch (err) {
        alert('网络错误');
    }
}

async function fetchLatestIssue(lotteryType) {
    try {
        const resp = await fetch('/api/prediction/latest_issues');
        if (!resp.ok) throw new Error('获取最新期号失败');
        const data = await resp.json();
        return data[lotteryType] || '';
    } catch (err) {
        console.error('获取最新期号失败:', err);
        return '';
    }
}

// 获取当前选中的彩种类型
function getFavLotteryType() {
    const activeBtn = document.querySelector('#favLotteryTypeGroup .btn.active');
    return activeBtn ? activeBtn.dataset.type : 'ssq';
}

// 切换彩种按钮
async function switchFavLotteryType(type) {
    // 更新按钮高亮
    document.querySelectorAll('#favLotteryTypeGroup .btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`#favLotteryTypeGroup .btn[data-type="${type}"]`).classList.add('active');
    // 重新初始化号码选择器
    initFavBallSelectors(type);
    // 获取最新期号并填入备注（+1）
    const issue = await fetchLatestIssue(type);
    if (issue) {
        const nextIssue = parseInt(issue) + 1;
        document.getElementById('favNote').value = '第' + nextIssue + '期';
    } else {
        document.getElementById('favNote').value = '';
    }
}

// 弹窗显示时初始化号码选择器，并自动填写备注（最新期号+1）
document.getElementById('addFavoriteModal').addEventListener('shown.bs.modal', async function() {
    const lotteryType = getFavLotteryType();
    initFavBallSelectors(lotteryType);
    // 获取最新期号并填入备注（+1）
    const issue = await fetchLatestIssue(lotteryType);
    if (issue) {
        const nextIssue = parseInt(issue) + 1;
        document.getElementById('favNote').value = '第' + nextIssue + '期';
    } else {
        document.getElementById('favNote').value = '';
    }
});
