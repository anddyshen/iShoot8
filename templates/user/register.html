{% extends "base.html" %}
{% block title %}注册{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0"><i class="bi bi-person-plus"></i> 用户注册</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('auth_routes.register') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">用户名 <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" name="username" 
                                   placeholder="至少3个字符" required minlength="3" autocomplete="username">
                        </div>
                        <div class="form-text">用户名将用于登录，不可修改</div>
                    </div>
                    <div class="mb-3">
                        <label for="nickname" class="form-label">昵称</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-emoji-smile"></i></span>
                            <input type="text" class="form-control" id="nickname" name="nickname" 
                                   placeholder="显示名称（选填）">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">邮箱 <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email" name="email" 
                                   placeholder="请输入邮箱（用于密码找回）" required>
                        </div>
                        <div class="form-text">邮箱用于密码找回，注册后将不可修改</div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">密码 <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" 
                                   placeholder="至少8个字符" required minlength="8" autocomplete="new-password">
                            <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <ul class="text-muted small mt-2" id="passwordRequirements" style="list-style: none; padding-left: 0;">
                            <li id="req-length" class="text-danger"><i class="bi bi-x-circle"></i> 至少8个字符</li>
                            <li id="req-upper" class="text-danger"><i class="bi bi-x-circle"></i> 包含至少一个大写字母</li>
                            <li id="req-lower" class="text-danger"><i class="bi bi-x-circle"></i> 包含至少一个小写字母</li>
                            <li id="req-digit" class="text-danger"><i class="bi bi-x-circle"></i> 包含至少一个数字</li>
                            <li id="req-special" class="text-danger"><i class="bi bi-x-circle"></i> 包含至少一个特殊字符（!@#$%^&* 等）</li>
                        </ul>
                        <div class="mt-2">
                            <div class="progress" style="height: 6px;">
                                <div id="passwordStrength" class="progress-bar" role="progressbar" 
                                     style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                            </div>
                            <small id="passwordStrengthText" class="text-muted">请输入密码</small>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">确认密码 <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" 
                                   placeholder="再次输入密码" required minlength="8" autocomplete="new-password">
                        </div>
                        <div id="passwordMatch" class="form-text"></div>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-success" id="submitBtn">
                            <i class="bi bi-person-plus"></i> 注册
                        </button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center">
                <span>已有账号？</span>
                <a href="{{ url_for('auth_routes.login') }}">立即登录</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// 密码强度检测函数 - 与 script.js 一致
function checkPasswordStrength(password) {
    let score = 0;
    const requirements = {
        length: password.length >= 8,
        upper: /[A-Z]/.test(password),
        lower: /[a-z]/.test(password),
        digit: /\d/.test(password),
        special: /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(password),
    };
    
    // 更新UI指示
    const reqEls = {
        length: document.getElementById('req-length'),
        upper: document.getElementById('req-upper'),
        lower: document.getElementById('req-lower'),
        digit: document.getElementById('req-digit'),
        special: document.getElementById('req-special'),
    };
    
    for (const [key, el] of Object.entries(reqEls)) {
        if (!el) continue;
        if (requirements[key]) {
            el.className = 'text-success';
            el.innerHTML = '<i class="bi bi-check-circle"></i> ' + el.textContent.replace(/^[^]*?(?=[^\d])/, '').trim() || el.textContent;
        } else {
            el.className = 'text-danger';
            el.innerHTML = '<i class="bi bi-x-circle"></i> ' + el.textContent.replace(/^[^]*?(?=[^\d])/, '').trim() || el.textContent;
        }
    }
    
    // 计算分数
    if (password.length >= 8) score += 20;
    if (password.length >= 12) score += 10;
    if (requirements.upper) score += 15;
    if (requirements.lower) score += 15;
    if (requirements.digit) score += 15;
    if (requirements.special) score += 15;
    if (requirements.upper && requirements.lower) score += 5;
    if (requirements.digit && requirements.special) score += 5;
    
    // 更新进度条
    const bar = document.getElementById('passwordStrength');
    const text = document.getElementById('passwordStrengthText');
    if (bar) bar.style.width = Math.min(100, score) + '%';
    
    if (text) {
        if (score < 30) {
            if (bar) bar.className = 'progress-bar bg-danger';
            text.textContent = '弱 - 密码强度不足';
            text.className = 'text-danger';
        } else if (score < 60) {
            if (bar) bar.className = 'progress-bar bg-warning';
            text.textContent = '中等 - 可以接受';
            text.className = 'text-warning';
        } else if (score < 80) {
            if (bar) bar.className = 'progress-bar bg-info';
            text.textContent = '强 - 密码强度良好';
            text.className = 'text-info';
        } else {
            if (bar) bar.className = 'progress-bar bg-success';
            text.textContent = '非常强 - 密码非常安全';
            text.className = 'text-success';
        }
    }
    
    return requirements.length && requirements.upper && requirements.lower && requirements.digit && requirements.special;
}

// 检查两次密码是否匹配
function checkPasswordsMatch() {
    const pwd = document.getElementById('password').value;
    const confirm = document.getElementById('confirm_password').value;
    const matchEl = document.getElementById('passwordMatch');
    const submitBtn = document.getElementById('submitBtn');
    
    if (!matchEl || !submitBtn) return;
    
    if (!confirm) {
        matchEl.textContent = '';
        matchEl.className = 'form-text';
        submitBtn.disabled = true;
        return;
    }
    
    const pwdValid = checkPasswordStrength(pwd);
    
    if (pwd === confirm) {
        matchEl.innerHTML = '<i class="bi bi-check-circle text-success"></i> 密码匹配';
        matchEl.className = 'form-text text-success';
        submitBtn.disabled = !pwdValid;
    } else {
        matchEl.innerHTML = '<i class="bi bi-x-circle text-danger"></i> 密码不匹配';
        matchEl.className = 'form-text text-danger';
        submitBtn.disabled = true;
    }
}

// 密码显示切换
document.getElementById('togglePassword').addEventListener('click', function() {
    const input = document.getElementById('password');
    const icon = this.querySelector('i');
    if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'bi bi-eye-slash';
    } else {
        input.type = 'password';
        icon.className = 'bi bi-eye';
    }
});

// 实时检查
document.getElementById('password').addEventListener('input', function() {
    checkPasswordStrength(this.value);
    if (document.getElementById('confirm_password').value) {
        checkPasswordsMatch();
    }
});

document.getElementById('confirm_password').addEventListener('input', checkPasswordsMatch);

// 页面加载时初始化
document.addEventListener('DOMContentLoaded', function() {
    checkPasswordStrength('');
});
</script>
{% endblock %}
