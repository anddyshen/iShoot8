{% extends "base.html" %}
{% block title %}注册{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0"><i class="bi bi-person-plus"></i> 用户注册</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('auth_routes.register') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">用户名 <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" name="username" 
                                   placeholder="至少3个字符" required minlength="3" autocomplete="username">
                        </div>
                        <div class="form-text">用户名将用于登录，不可修改</div>
                    </div>
                    <div class="mb-3">
                        <label for="nickname" class="form-label">昵称</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-emoji-smile"></i></span>
                            <input type="text" class="form-control" id="nickname" name="nickname" 
                                   placeholder="显示名称（选填）">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">邮箱</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email" name="email" 
                                   placeholder="用于密码找回（选填）">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">密码 <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" 
                                   placeholder="至少8个字符" required minlength="8" autocomplete="new-password">
                            <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <ul class="text-muted small mt-2" id="passwordRequirements" style="list-style: none; padding-left: 0;">
                            <li id="req-length" class="text-danger"><i class="bi bi-x-circle"></i> 至少8个字符</li>
                            <li id="req-upper" class="text-danger"><i class="bi bi-x-circle"></i> 包含至少一个大写字母</li>
                            <li id="req-lower" class="text-danger"><i class="bi bi-x-circle"></i> 包含至少一个小写字母</li>
                            <li id="req-digit" class="text-danger"><i class="bi bi-x-circle"></i> 包含至少一个数字</li>
                            <li id="req-special" class="text-danger"><i class="bi bi-x-circle"></i> 包含至少一个特殊字符（!@#$%^&* 等）</li>
                        </ul>
                        <div class="mt-2">
                            <div class="progress" style="height: 6px;">
                                <div id="passwordStrength" class="progress-bar" role="progressbar" 
                                     style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                            </div>
                            <small id="passwordStrengthText" class="text-muted">请输入密码</small>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">确认密码 <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" 
                                   placeholder="再次输入密码" required minlength="8" autocomplete="new-password">
                        </div>
                        <div id="passwordMatch" class="form-text"></div>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-person-plus"></i> 注册
                        </button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center">
                <span>已有账号？</span>
                <a href="{{ url_for('auth_routes.login') }}">立即登录</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
