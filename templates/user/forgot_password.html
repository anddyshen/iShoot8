{% extends "base.html" %}
{% block title %}忘记密码{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow">
            <div class="card-header bg-warning text-dark">
                <h4 class="mb-0"><i class="bi bi-question-circle"></i> 忘记密码</h4>
            </div>
            <div class="card-body">
                <p class="text-muted">请输入您的用户名或注册邮箱，我们将向您绑定的邮箱发送密码重置链接。</p>
                <form method="POST" action="{{ url_for('auth_routes.forgot_password') }}">
                    <div class="mb-3">
                        <label for="email_or_username" class="form-label">用户名 / 邮箱</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="email_or_username" name="email_or_username" 
                                   placeholder="请输入用户名或注册邮箱" required>
                        </div>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-warning">
                            <i class="bi bi-send"></i> 发送重置链接
                        </button>
                        <a href="{{ url_for('auth_routes.login') }}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> 返回登录
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
