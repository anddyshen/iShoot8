{% extends "base.html" %}
{% block title %}已购号码{% endblock %}
{% block content %}
<style>
.ball-selector {
    border: 1px solid #dee2e6;
    border-radius: 8px;
    padding: 10px;
    background: #f8f9fa;
}
.ball-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
}
.selector-ball {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    font-size: 13px;
    font-weight: bold;
    transition: all 0.2s ease;
    user-select: none;
}
.selector-ball.red {
    background: #fff;
    color: #dc3545;
    border-color: #dc3545;
}
.selector-ball.red:hover {
    background: #fce4e4;
}
.selector-ball.red.selected {
    background: #dc3545;
    color: #fff;
    border-color: #dc3545;
    box-shadow: 0 2px 6px rgba(220, 53, 69, 0.4);
}
.selector-ball.blue {
    background: #fff;
    color: #0d6efd;
    border-color: #0d6efd;
}
.selector-ball.blue:hover {
    background: #e4edfc;
}
.selector-ball.blue.selected {
    background: #0d6efd;
    color: #fff;
    border-color: #0d6efd;
    box-shadow: 0 2px 6px rgba(13, 110, 253, 0.4);
}
.selector-ball:active {
    transform: scale(0.9);
}
.selected-display {
    font-size: 0.9rem;
}
</style>
<div class="card shadow">
    <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
        <h4 class="mb-0"><i class="bi bi-cart-check"></i> 已购号码</h4>
        <div class="d-flex align-items-center gap-2">
            <button class="btn btn-sm btn-outline-light d-none" id="batchDeleteBtn" onclick="batchDeleteTickets()">
                <i class="bi bi-trash"></i> 批量删除
            </button>
            <span class="badge bg-light text-dark" id="countBadge">0 条</span>
            <button class="btn btn-sm btn-light ms-2" onclick="refreshData()" title="刷新数据">
                <i class="bi bi-arrow-clockwise"></i>
            </button>
        </div>
    </div>
    <div class="card-body">
        <div class="row mb-3">
            <div class="col-md-6">
                <p class="text-muted">
                    <i class="bi bi-info-circle"></i> 
                    记录您购买过的号码，系统将自动计算中奖情况和 ROI。
                </p>
            </div>
            <div class="col-md-6 text-end">
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addTicketModal">
                    <i class="bi bi-plus-circle"></i> 添加欲购号码
                </button>
            </div>
        </div>

        <!-- 统计概览 -->
        <div class="row mb-4" id="statsOverview">
            <div class="col-md-3">
                <div class="card bg-light">
                    <div class="card-body text-center">
                        <h6>总投入</h6>
                        <h4 class="text-danger" id="totalCost">¥0</h4>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-light">
                    <div class="card-body text-center">
                        <h6>总回报</h6>
                        <h4 class="text-success" id="totalPrize">¥0</h4>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-light">
                    <div class="card-body text-center">
                        <h6>净收益</h6>
                        <h4 id="netProfit">¥0</h4>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-light">
                    <div class="card-body text-center">
                        <h6>ROI</h6>
                        <h4 id="roiRate">0%</h4>
                    </div>
                </div>
            </div>
        </div>

        <!-- 彩种筛选标签 -->
        <div class="btn-group mb-3" role="group" id="filterTabs">
            <button type="button" class="btn btn-outline-secondary active" data-filter="all" onclick="switchFilter('all')">全部</button>
            <button type="button" class="btn btn-outline-primary" data-filter="ssq" onclick="switchFilter('ssq')">双色球</button>
            <button type="button" class="btn btn-outline-success" data-filter="dlt" onclick="switchFilter('dlt')">大乐透</button>
        </div>

        <div id="ticketsList">
            <div class="text-center text-muted py-5">
                <i class="bi bi-inbox display-1"></i>
                <p class="mt-3">暂无已购号码记录</p>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addTicketModal">
                    <i class="bi bi-plus-circle"></i> 添加欲购号码
                </button>
            </div>
        </div>

        <!-- 分页控件 -->
        <nav id="paginationNav" style="display:none;" class="mt-3">
            <ul class="pagination justify-content-center">
                <li class="page-item" id="prevPageBtn">
                    <a class="page-link" href="#" onclick="goPage(-1)">上一页</a>
                </li>
                <li class="page-item disabled"><a class="page-link" id="pageInfo" href="#">1/1</a></li>
                <li class="page-item" id="nextPageBtn">
                    <a class="page-link" href="#" onclick="goPage(1)">下一页</a>
                </li>
            </ul>
        </nav>
    </div>
</div>

<!-- 添加欲购号码弹窗 -->
<div class="modal fade" id="addTicketModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-plus-circle"></i> 添加欲购号码</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="addTicketForm">
                    <div class="mb-3">
                        <label class="form-label">彩种</label>
                        <select class="form-select" id="ticketLotteryType" required>
                            <option value="ssq">双色球</option>
                            <option value="dlt">大乐透</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">期号</label>
                        <div>
                            <div class="input-group" style="width:200px;">
                                <button class="btn btn-outline-secondary" onclick="adjustAddIssue(-1)" type="button">−</button>
                                <input type="text" class="form-control text-center" id="ticketIssue" placeholder="如 2026050" inputmode="numeric" pattern="[0-9]*" required>
                                <button class="btn btn-outline-secondary" onclick="adjustAddIssue(1)" type="button">+</button>
                            </div>
                        </div>
                    </div>

                    <!-- 红球/前区号码选择器 -->
                    <div class="mb-3">
                        <label class="form-label" id="redLabel">红球号码（点击选择，支持复式，不限数量）</label>
                        <div class="ball-selector" id="redBallSelector">
                            <div class="ball-grid" id="redBallGrid">
                                <!-- 由JS动态生成 -->
                            </div>
                        </div>
                    </div>

                    <!-- 蓝球/后区号码选择器 -->
                    <div class="mb-3">
                        <label class="form-label" id="blueLabel">蓝球号码（点击选择，支持复式，不限数量）</label>
                        <div class="ball-selector" id="blueBallSelector">
                            <div class="ball-grid" id="blueBallGrid">
                                <!-- 由JS动态生成 -->
                            </div>
                        </div>
                    </div>

                    <!-- 已选号码显示 -->
                    <div class="mb-3">
                        <div class="selected-display p-2 bg-light rounded">
                            <span class="text-muted">已选：</span>
                            <span id="selectedRedDisplay" class="text-danger fw-bold me-2">红球：未选择</span>
                            <span id="selectedBlueDisplay" class="text-primary fw-bold">蓝球：未选择</span>
                        </div>
                    </div>

                    <!-- 注数与金额自动计算 -->
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <div class="card bg-light">
                                <div class="card-body py-2 px-3 text-center">
                                    <small class="text-muted">注数</small>
                                    <h5 class="mb-0" id="ticketUnits">0</h5>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card bg-light">
                                <div class="card-body py-2 px-3 text-center">
                                    <small class="text-muted">单价</small>
                                    <h5 class="mb-0">2 元/注</h5>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card bg-success bg-opacity-10">
                                <div class="card-body py-2 px-3 text-center">
                                    <small class="text-muted">总金额</small>
                                    <h5 class="mb-0 text-danger fw-bold" id="ticketCostDisplay">¥0</h5>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">倍数</label>
                        <input type="number" class="form-control" id="ticketMultiplier" value="1" min="1" required onchange="updateCost()">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">备注（选填）</label>
                        <input type="text" class="form-control" id="ticketNote" placeholder="如：机选、自选等">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="addTicket()">
                    <i class="bi bi-check-lg"></i> 添加
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// 组合数计算函数 C(n, k)
function combination(n, k) {
    if (k > n || k < 0) return 0;
    if (k === 0 || k === n) return 1;
    k = Math.min(k, n - k);
    let result = 1;
    for (let i = 1; i <= k; i++) {
        result = result * (n - k + i) / i;
    }
    return result;
}

// 计算复式注数
function calculateUnits(redCount, blueCount, lotteryType) {
    if (lotteryType === 'ssq') {
        // 双色球：红球6选n，蓝球1选m
        const redWays = combination(redCount, 6);
        const blueWays = combination(blueCount, 1);
        return redWays * blueWays;
    } else {
        // 大乐透：前区5选n，后区2选m
        const redWays = combination(redCount, 5);
        const blueWays = combination(blueCount, 2);
        return redWays * blueWays;
    }
}

// 更新注数和金额显示
function updateCost() {
    const lotteryType = document.getElementById('ticketLotteryType').value;
    const multiplier = parseInt(document.getElementById('ticketMultiplier').value) || 1;
    const redCount = selectedRedBalls.size;
    const blueCount = selectedBlueBalls.size;
    
    let units = 0;
    if (redCount > 0 && blueCount > 0) {
        units = calculateUnits(redCount, blueCount, lotteryType);
    }
    
    document.getElementById('ticketUnits').textContent = units;
    const totalCost = units * 2 * multiplier;
    document.getElementById('ticketCostDisplay').textContent = '¥' + totalCost;
}

// 当前状态
let currentFilter = 'all';
let currentPage = 1;
const perPage = 20;
let totalPages = 1;
let selectedIds = new Set();

// 号码选择器状态
let selectedRedBalls = new Set();
let selectedBlueBalls = new Set();

function switchFilter(filter) {
    currentFilter = filter;
    currentPage = 1;
    selectedIds.clear();
    updateBatchDeleteBtn();
    // 更新按钮高亮
    document.querySelectorAll('#filterTabs .btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`#filterTabs .btn[data-filter="${filter}"]`).classList.add('active');
    loadTickets();
}

function goPage(delta) {
    const newPage = currentPage + delta;
    if (newPage < 1 || newPage > totalPages) return;
    currentPage = newPage;
    selectedIds.clear();
    updateBatchDeleteBtn();
    loadTickets();
}

function toggleSelectAll() {
    const selectAllCheckbox = document.getElementById('selectAll');
    const isChecked = selectAllCheckbox.checked;
    document.querySelectorAll('.ticket-checkbox').forEach(cb => {
        cb.checked = isChecked;
        const id = parseInt(cb.dataset.id);
        if (isChecked) {
            selectedIds.add(id);
        } else {
            selectedIds.delete(id);
        }
    });
    updateBatchDeleteBtn();
}

function toggleSelect(id) {
    const cb = document.querySelector(`.ticket-checkbox[data-id="${id}"]`);
    if (cb.checked) {
        selectedIds.add(id);
    } else {
        selectedIds.delete(id);
        document.getElementById('selectAll').checked = false;
    }
    updateBatchDeleteBtn();
}

function updateBatchDeleteBtn() {
    const btn = document.getElementById('batchDeleteBtn');
    if (selectedIds.size > 0) {
        btn.classList.remove('d-none');
        btn.innerHTML = `<i class="bi bi-trash"></i> 批量删除 (${selectedIds.size})`;
    } else {
        btn.classList.add('d-none');
    }
}

async function batchDeleteTickets() {
    if (selectedIds.size === 0) return;
    if (!confirm(`确定删除选中的 ${selectedIds.size} 条已购号码？`)) return;
    
    try {
        const resp = await fetch('/auth/api/purchased/batch_delete', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ids: Array.from(selectedIds)}),
        });
        if (resp.ok) {
            selectedIds.clear();
            updateBatchDeleteBtn();
            checkAllTickets();
            loadTickets();
        } else {
            const result = await resp.json();
            alert('删除失败：' + (result.error || '未知错误'));
        }
    } catch (err) {
        alert('网络错误');
    }
}

async function checkAllTickets() {
    try {
        await fetch('/auth/api/purchased/check_all', { method: 'POST' });
    } catch (err) {
        console.error('对奖失败:', err);
    }
}

/** 北京时间格式化：手动解析 ISO 字符串，强制显示北京时间 */
function formatBeijingTime(dateStr) {
    if (!dateStr) return '-';
    let clean = dateStr.replace(/[Zz]$/, '').replace(/[+-]\d{2}:\d{2}$/, '');
    const parts = clean.split('T');
    if (parts.length !== 2) return dateStr;
    return parts[0] + ' ' + parts[1].split('.')[0];
}

async function loadTickets() {
    try {
        const url = `/auth/api/purchased?page=${currentPage}&per_page=${perPage}&lottery_type=${currentFilter}`;
        const resp = await fetch(url);
        if (!resp.ok) throw new Error('获取失败');
        const data = await resp.json();
        const container = document.getElementById('ticketsList');
        const badge = document.getElementById('countBadge');
        
        // 更新分页状态
        totalPages = data.total_pages || 1;
        const paginationNav = document.getElementById('paginationNav');
        const pageInfo = document.getElementById('pageInfo');
        
        if (totalPages > 1) {
            paginationNav.style.display = '';
            pageInfo.textContent = `${data.page}/${totalPages}`;
            document.getElementById('prevPageBtn').className = 'page-item' + (data.page <= 1 ? ' disabled' : '');
            document.getElementById('nextPageBtn').className = 'page-item' + (data.page >= totalPages ? ' disabled' : '');
        } else {
            paginationNav.style.display = 'none';
        }
        
        // 更新统计
        if (data.stats) {
            document.getElementById('totalCost').textContent = '¥' + data.stats.total_cost.toFixed(2);
            document.getElementById('totalPrize').textContent = '¥' + data.stats.total_prize.toFixed(2);
            const profit = data.stats.total_prize - data.stats.total_cost;
            const profitEl = document.getElementById('netProfit');
            profitEl.textContent = '¥' + profit.toFixed(2);
            profitEl.className = profit >= 0 ? 'text-success' : 'text-danger';
            
            const roiEl = document.getElementById('roiRate');
            if (data.stats.total_cost > 0) {
                const roi = (data.stats.total_prize / data.stats.total_cost * 100);
                roiEl.textContent = roi.toFixed(2) + '%';
                roiEl.className = roi >= 100 ? 'text-success' : 'text-danger';
            } else {
                roiEl.textContent = '0%';
            }
        }
        
        if (!data.tickets || data.tickets.length === 0) {
            container.innerHTML = `
                <div class="text-center text-muted py-5">
                    <i class="bi bi-inbox display-1"></i>
                    <p class="mt-3">暂无已购号码记录</p>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addTicketModal">
                        <i class="bi bi-plus-circle"></i> 添加欲购号码
                    </button>
                </div>`;
            badge.textContent = '0 条';
            return;
        }
        
        badge.textContent = data.total + ' 条';
        let html = '<div class="table-responsive"><table class="table table-hover">';
        html += `<thead class="table-light">
            <tr>
                <th style="width:40px;">
                    <input type="checkbox" id="selectAll" onchange="toggleSelectAll()" class="form-check-input">
                </th>
                <th>#</th>
                <th>彩种</th>
                <th>期号</th>
                <th>号码</th>
                <th>倍数</th>
                <th>金额</th>
                <th>中奖</th>
                <th>添加时间</th>
                <th>操作</th>
            </tr>
        </thead><tbody>`;
        
        const startIdx = (data.page - 1) * data.per_page;
        data.tickets.forEach((item, idx) => {
            let ballsHtml = '';
            if (item.red_balls) {
                const reds = item.red_balls.split(',').map(n => parseInt(n));
                const blues = item.blue_balls ? item.blue_balls.split(',').map(n => parseInt(n)) : [];
                ballsHtml = reds.map(n => `<span class="ball ball-red" style="display:inline-block;width:28px;height:28px;line-height:28px;border-radius:50%;text-align:center;background:#ff6b6b;color:#fff;font-size:11px;margin:1px;">${String(n).padStart(2, '0')}</span>`).join('');
                ballsHtml += blues.map(n => `<span class="ball ball-blue" style="display:inline-block;width:28px;height:28px;line-height:28px;border-radius:50%;text-align:center;background:#339af0;color:#fff;font-size:11px;margin:1px;">${String(n).padStart(2, '0')}</span>`).join('');
            }
            
            // 中奖信息显示
            let prizeHtml = '';
            if (item.prize_amount > 0) {
                prizeHtml = `<span class="text-success fw-bold">¥${item.prize_amount.toFixed(2)}${item.prize_level ? '<br><small>' + item.prize_level + '</small>' : ''}</span>`;
            } else {
                prizeHtml = '<span class="text-muted">未中奖</span>';
            }
            
            html += `<tr>
                <td>
                    <input type="checkbox" class="form-check-input ticket-checkbox" data-id="${item.id}" onchange="toggleSelect(${item.id})">
                </td>
                <td>${startIdx + idx + 1}</td>
                <td><span class="badge bg-${item.lottery_type === 'ssq' ? 'primary' : 'success'}">${item.lottery_type === 'ssq' ? '双色球' : '大乐透'}</span></td>
                <td>
                    <span id="issue_text_${item.id}">${item.issue || '-'}</span>
                    <span id="issue_edit_group_${item.id}" style="display:none;">
                        <button class="btn btn-sm btn-outline-secondary" onclick="adjustIssue(${item.id}, -1)" title="减1" style="padding:0 6px;">−</button>
                        <input type="text" inputmode="numeric" id="issue_input_${item.id}" value="${item.issue || ''}" class="form-control form-control-sm" style="display:inline-block;width:90px;text-align:center;height:30px;" pattern="[0-9]*">
                        <button class="btn btn-sm btn-outline-secondary" onclick="adjustIssue(${item.id}, 1)" title="加1" style="padding:0 6px;">+</button>
                    </span>
                    <button class="btn btn-sm btn-outline-primary ms-1" id="issue_btn_${item.id}" onclick="toggleEditIssue(${item.id})" style="padding:0 8px;font-size:12px;">
                        <i class="bi bi-pencil"></i> 改
                    </button>
                </td>
                <td>${ballsHtml || '-'}</td>
                <td>
                    <span id="multiplier_text_${item.id}">${item.multiplier || 1} 倍</span>
                    <span id="multiplier_edit_group_${item.id}" style="display:none;">
                        <button class="btn btn-sm btn-outline-secondary" onclick="adjustMultiplier(${item.id}, -1)" title="减1" style="padding:0 6px;">−</button>
                        <input type="number" id="multiplier_input_${item.id}" value="${item.multiplier || 1}" class="form-control form-control-sm" style="display:inline-block;width:60px;text-align:center;height:30px;" min="1">
                        <button class="btn btn-sm btn-outline-secondary" onclick="adjustMultiplier(${item.id}, 1)" title="加1" style="padding:0 6px;">+</button>
                    </span>
                    <button class="btn btn-sm btn-outline-primary ms-1" id="multiplier_btn_${item.id}" onclick="toggleEditMultiplier(${item.id})" style="padding:0 8px;font-size:12px;">
                        <i class="bi bi-pencil"></i> 改
                    </button>
                </td>
                <td id="cost_display_${item.id}">¥${(item.cost || 0).toFixed(2)}</td>
                <td>${prizeHtml}</td>
                <td>${formatBeijingTime(item.created_at)}</td>
                <td>
                    <button class="btn btn-sm btn-outline-danger" onclick="removeTicket(${item.id})">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            </tr>`;
        });
        
        html += '</tbody></table></div>';
        container.innerHTML = html;
    } catch (err) {
        console.error(err);
    }
}

// ========== 号码选择器逻辑 ==========

function buildBallSelector(containerId, count, type) {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.innerHTML = '';
    for (let i = 1; i <= count; i++) {
        const ball = document.createElement('div');
        ball.className = `selector-ball ${type}`;
        ball.textContent = String(i).padStart(2, '0');
        ball.dataset.num = i;
        ball.onclick = function() { toggleBall(this, type); };
        container.appendChild(ball);
    }
}

function toggleBall(el, type) {
    const num = parseInt(el.dataset.num);
    if (type === 'red') {
        if (selectedRedBalls.has(num)) {
            selectedRedBalls.delete(num);
            el.classList.remove('selected');
        } else {
            selectedRedBalls.add(num);
            el.classList.add('selected');
        }
    } else if (type === 'blue') {
        if (selectedBlueBalls.has(num)) {
            selectedBlueBalls.delete(num);
            el.classList.remove('selected');
        } else {
            selectedBlueBalls.add(num);
            el.classList.add('selected');
        }
    }
    updateSelectedDisplay();
    updateCost();
}

function updateSelectedDisplay() {
    const redArr = Array.from(selectedRedBalls).sort((a, b) => a - b);
    const blueArr = Array.from(selectedBlueBalls).sort((a, b) => a - b);
    
    const redDisplay = document.getElementById('selectedRedDisplay');
    const blueDisplay = document.getElementById('selectedBlueDisplay');
    
    if (redArr.length > 0) {
        redDisplay.innerHTML = '红球：<span class="text-danger">' + redArr.map(n => String(n).padStart(2, '0')).join(', ') + '</span>';
    } else {
        redDisplay.innerHTML = '红球：<span class="text-muted">未选择</span>';
    }
    
    if (blueArr.length > 0) {
        blueDisplay.innerHTML = '蓝球：<span class="text-primary">' + blueArr.map(n => String(n).padStart(2, '0')).join(', ') + '</span>';
    } else {
        blueDisplay.innerHTML = '蓝球：<span class="text-muted">未选择</span>';
    }
}

function resetBallSelectors() {
    selectedRedBalls.clear();
    selectedBlueBalls.clear();
    // 清除所有选中样式
    document.querySelectorAll('#redBallGrid .selector-ball').forEach(el => el.classList.remove('selected'));
    document.querySelectorAll('#blueBallGrid .selector-ball').forEach(el => el.classList.remove('selected'));
    updateSelectedDisplay();
    updateCost();
}

function initBallSelectors(lotteryType) {
    if (lotteryType === 'ssq') {
        document.getElementById('redLabel').textContent = '红球号码（点击选择，支持复式，不限数量，1-33）';
        document.getElementById('blueLabel').textContent = '蓝球号码（点击选择，支持复式，不限数量，1-16）';
        buildBallSelector('redBallGrid', 33, 'red');
        buildBallSelector('blueBallGrid', 16, 'blue');
    } else {
        document.getElementById('redLabel').textContent = '前区号码（点击选择，支持复式，不限数量，1-35）';
        document.getElementById('blueLabel').textContent = '后区号码（点击选择，支持复式，不限数量，1-12）';
        buildBallSelector('redBallGrid', 35, 'red');
        buildBallSelector('blueBallGrid', 12, 'blue');
    }
    // 重置选中状态
    resetBallSelectors();
}

// ========== 倍数编辑逻辑 ==========

function adjustMultiplier(id, delta) {
    const input = document.getElementById('multiplier_input_' + id);
    let val = parseInt(input.value);
    if (!isNaN(val)) {
        val = Math.max(1, val + delta);
        input.value = val;
    }
}

async function toggleEditMultiplier(id) {
    const textSpan = document.getElementById('multiplier_text_' + id);
    const editGroup = document.getElementById('multiplier_edit_group_' + id);
    const input = document.getElementById('multiplier_input_' + id);
    const btn = document.getElementById('multiplier_btn_' + id);
    
    if (editGroup.style.display === 'none') {
        // 切换到编辑模式
        textSpan.style.display = 'none';
        editGroup.style.display = 'inline-block';
        input.focus();
        btn.innerHTML = '<i class="bi bi-check-lg"></i> 存';
    } else {
        // 保存模式
        const newMultiplier = parseInt(input.value);
        if (!newMultiplier || newMultiplier < 1) {
            alert('倍数至少为1');
            input.focus();
            return;
        }
        
        try {
            // 先获取当前ticket数据计算新金额
            const ticketsResp = await fetch(`/auth/api/purchased?page=1&per_page=1000`);
            const ticketsData = await ticketsResp.json();
            const ticket = ticketsData.tickets.find(t => t.id === id);
            if (!ticket) {
                alert('记录不存在');
                return;
            }
            
            // 根据号码计算注数
            const redCount = ticket.red_balls ? ticket.red_balls.split(',').length : 0;
            const blueCount = ticket.blue_balls ? ticket.blue_balls.split(',').length : 0;
            const units = calculateUnits(redCount, blueCount, ticket.lottery_type);
            const newCost = units * 2 * newMultiplier;
            
            const resp = await fetch('/auth/api/purchased/' + id, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({multiplier: newMultiplier, cost: newCost}),
            });
            const result = await resp.json();
            if (resp.ok) {
                textSpan.textContent = newMultiplier + ' 倍';
                const costDisplay = document.getElementById('cost_display_' + id);
                costDisplay.textContent = '¥' + newCost.toFixed(2);
                textSpan.style.display = 'inline';
                editGroup.style.display = 'none';
                btn.innerHTML = '<i class="bi bi-pencil"></i> 改';
                // 刷新列表更新统计
                loadTickets();
            } else {
                alert('保存失败：' + (result.error || '未知错误'));
            }
        } catch (err) {
            alert('网络错误，请重试');
        }
    }
}

// ========== 添加弹窗期号调整 ==========

function adjustAddIssue(delta) {
    const input = document.getElementById('ticketIssue');
    let val = parseInt(input.value);
    if (isNaN(val)) {
        // 如果输入为空或不是数字，设为空并返回
        return;
    }
    input.value = val + delta;
}

// ========== 期号编辑逻辑 ==========

function adjustIssue(id, delta) {
    const input = document.getElementById('issue_input_' + id);
    let val = parseInt(input.value);
    if (!isNaN(val)) {
        input.value = val + delta;
    }
}

async function toggleEditIssue(id) {
    const textSpan = document.getElementById('issue_text_' + id);
    const editGroup = document.getElementById('issue_edit_group_' + id);
    const input = document.getElementById('issue_input_' + id);
    const btn = document.getElementById('issue_btn_' + id);
    
    if (editGroup.style.display === 'none') {
        // 切换到编辑模式
        textSpan.style.display = 'none';
        editGroup.style.display = 'inline-block';
        input.focus();
        btn.innerHTML = '<i class="bi bi-check-lg"></i> 存';
    } else {
        // 保存模式
        const newIssue = input.value.trim();
        if (!newIssue) {
            alert('期号不能为空');
            input.focus();
            return;
        }
        
        try {
            const resp = await fetch('/auth/api/purchased/' + id, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({issue: newIssue}),
            });
            const result = await resp.json();
            if (resp.ok) {
                textSpan.textContent = newIssue;
                textSpan.style.display = 'inline';
                editGroup.style.display = 'none';
                btn.innerHTML = '<i class="bi bi-pencil"></i> 改';
                // 保存后重新对所有号码对奖，然后刷新列表
                await checkAllTickets();
                loadTickets();
            } else {
                alert('保存失败：' + (result.error || '未知错误'));
            }
        } catch (err) {
            alert('网络错误，请重试');
        }
    }
}

// ========== 添加/删除逻辑 ==========

async function addTicket() {
    const redArr = Array.from(selectedRedBalls).sort((a, b) => a - b);
    const blueArr = Array.from(selectedBlueBalls).sort((a, b) => a - b);
    const lotteryType = document.getElementById('ticketLotteryType').value;
    const multiplier = parseInt(document.getElementById('ticketMultiplier').value) || 1;
    
    // 自动计算注数和金额
    const units = calculateUnits(redArr.length, blueArr.length, lotteryType);
    const cost = units * 2 * multiplier;
    
    const data = {
        lottery_type: lotteryType,
        issue: document.getElementById('ticketIssue').value.trim(),
        red_balls: redArr.join(','),
        blue_balls: blueArr.join(','),
        cost: cost,
        multiplier: multiplier,
        note: document.getElementById('ticketNote').value.trim(),
    };
    
    if (!data.issue) {
        alert('请输入期号');
        return;
    }
    if (redArr.length === 0) {
        alert('请选择红球号码');
        return;
    }
    if (blueArr.length === 0) {
        alert('请选择蓝球号码');
        return;
    }
    if (cost < 2) {
        alert('投注金额至少2元');
        return;
    }
    
    try {
        const resp = await fetch('/auth/api/purchased', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data),
        });
        const result = await resp.json();
        if (resp.ok) {
            const modal = bootstrap.Modal.getInstance(document.getElementById('addTicketModal'));
            modal.hide();
            resetBallSelectors();
            document.getElementById('ticketIssue').value = '';
            document.getElementById('ticketMultiplier').value = '1';
            document.getElementById('ticketNote').value = '';
            loadTickets();
        } else {
            alert('错误：' + result.error);
        }
    } catch (err) {
        alert('网络错误');
    }
}

async function removeTicket(id) {
    if (!confirm('确定删除此记录？')) return;
    try {
        const resp = await fetch('/auth/api/purchased/' + id, { method: 'DELETE' });
        if (resp.ok) {
            selectedIds.delete(id);
            updateBatchDeleteBtn();
            loadTickets();
        } else {
            alert('删除失败');
        }
    } catch (err) {
        alert('网络错误');
    }
}

async function refreshData() {
    // 刷新数据：先对奖，再重新加载列表
    await checkAllTickets();
    loadTickets();
}

async function fetchLatestIssue(lotteryType) {
    try {
        const resp = await fetch('/api/prediction/latest_issues');
        if (!resp.ok) throw new Error('获取最新期号失败');
        const data = await resp.json();
        return data[lotteryType] || '';
    } catch (err) {
        console.error('获取最新期号失败:', err);
        return '';
    }
}

// 弹窗显示时初始化号码选择器并自动填充期号
document.getElementById('addTicketModal').addEventListener('shown.bs.modal', async function() {
    const lotteryType = document.getElementById('ticketLotteryType').value;
    initBallSelectors(lotteryType);
    updateCost();
    const issue = await fetchLatestIssue(lotteryType);
    if (issue) {
        document.getElementById('ticketIssue').value = issue;
    }
});

// 切换彩种时更新号码选择器并自动更新期号
document.getElementById('ticketLotteryType').addEventListener('change', async function() {
    const lotteryType = this.value;
    initBallSelectors(lotteryType);
    updateCost();
    const issue = await fetchLatestIssue(lotteryType);
    if (issue) {
        document.getElementById('ticketIssue').value = issue;
    }
});

document.addEventListener('DOMContentLoaded', async function() {
    // 1. 先对所有号码对奖
    await checkAllTickets();
    // 2. 加载显示数据
    loadTickets();
});
</script>
