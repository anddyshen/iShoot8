{% extends "base.html" %}

{% block title %}通知设置 - {{ site_name }}{% endblock %}

{% block head %}
<style>
.notification-settings { max-width: 800px; margin: 0 auto; }
.settings-card { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.settings-card h3 { margin-top: 0; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid #f0f0f0; color: #333; font-size: 18px; display: flex; align-items: center; gap: 8px; }
.channel-item { display: flex; align-items: flex-start; padding: 16px; border: 1px solid #e8e8e8; border-radius: 8px; margin-bottom: 12px; transition: all 0.2s; }
.channel-item:hover { border-color: #667eea; box-shadow: 0 2px 8px rgba(102,126,234,0.1); }
.channel-item.disabled { opacity: 0.6; background: #f9f9f9; }
.channel-switch { margin-right: 16px; padding-top: 2px; }
.channel-switch input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; accent-color: #667eea; }
.channel-info { flex: 1; }
.channel-info .channel-label { font-size: 16px; font-weight: 600; color: #333; margin-bottom: 4px; }
.channel-info .channel-desc { font-size: 13px; color: #999; }
.channel-config { width: 100%; margin-top: 12px; padding: 12px; background: #fafafa; border-radius: 6px; display: none; }
.channel-config.show { display: block; }
.channel-config .form-group { margin-bottom: 12px; }
.channel-config .form-group:last-child { margin-bottom: 0; }
.channel-config label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; font-weight: 500; }
.channel-config input { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; transition: border-color 0.2s; }
.channel-config input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 2px rgba(102,126,234,0.1); }
.channel-test .btn-test { padding: 6px 16px; font-size: 12px; border: 1px solid #667eea; color: #667eea; background: transparent; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
.channel-test .btn-test:hover { background: #667eea; color: #fff; }
.channel-test .btn-test:disabled { opacity: 0.5; cursor: not-allowed; }
.event-settings { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.event-item { display: flex; align-items: center; padding: 12px; border: 1px solid #e8e8e8; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
.event-item:hover { border-color: #667eea; }
.event-item input[type="checkbox"] { margin-right: 10px; width: 18px; height: 18px; accent-color: #667eea; }
.event-item .event-label { font-size: 14px; color: #333; font-weight: 500; }
.event-item .event-desc { font-size: 12px; color: #999; margin-top: 2px; }
.save-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
.save-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(102,126,234,0.4); }
.save-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.toast { position: fixed; top: 80px; right: 20px; padding: 12px 24px; border-radius: 8px; color: #fff; font-size: 14px; z-index: 10000; opacity: 0; transform: translateX(100px); transition: all 0.3s; }
.toast.show { opacity: 1; transform: translateX(0); }
.toast.success { background: #52c41a; }
.toast.error { background: #ff4d4f; }
@media (max-width: 768px) {
  .event-settings { grid-template-columns: 1fr; }
  .settings-card { padding: 16px; }
}
</style>
{% endblock %}

{% block content %}
<div class="notification-settings">
  <h1 style="margin-bottom: 24px; font-size: 24px; color: #333;">
    🔔 通知设置
    <small style="font-size: 14px; font-weight: 400; color: #999; margin-left: 8px;">配置您的通知接收方式和偏好</small>
  </h1>

  <div class="settings-card">
    <h3>📡 通知渠道</h3>
    <p style="color: #666; margin-bottom: 16px; font-size: 14px;">
      选择您希望接收通知的方式，并配置相应的接入信息。
    </p>
    <div id="channelList">
      <div class="loading" style="text-align: center; padding: 40px; color: #999;">加载中...</div>
    </div>
  </div>

  <div class="settings-card">
    <h3>🎯 通知事件</h3>
    <p style="color: #666; margin-bottom: 16px; font-size: 14px;">
      选择您希望接收哪些类型的通知。
    </p>
    <div class="event-settings">
      <label class="event-item">
        <input type="checkbox" id="notify_on_prize" checked>
        <div>
          <div class="event-label">🏆 中奖通知</div>
          <div class="event-desc">当您购买的号码中奖时发送通知</div>
        </div>
      </label>
      <label class="event-item">
        <input type="checkbox" id="notify_on_smart_filter" checked>
        <div>
          <div class="event-label">🎯 智能筛选结果</div>
          <div class="event-desc">智能筛选完成后发送结果通知</div>
        </div>
      </label>
      <label class="event-item">
        <input type="checkbox" id="notify_on_draw_results">
        <div>
          <div class="event-label">📊 开奖结果</div>
          <div class="event-desc">新一期开奖结果发布时通知</div>
        </div>
      </label>
    </div>
  </div>

  <button class="save-btn" id="saveBtn" onclick="saveSettings()">💾 保存设置</button>
  <div id="toast" class="toast"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
let config = {
  enabled_channels: ['in_app'],
  channel_configs: {},
  notify_on_prize: true,
  notify_on_smart_filter: true,
  notify_on_draw_results: false,
};
let availableChannels = [];

async function loadSettings() {
  try {
    const res = await fetch('/auth/api/notification/settings');
    const data = await res.json();
    config = data.config || config;
    availableChannels = data.available_channels || [];
    renderChannels();
    applyEventSettings();
  } catch (e) {
    showToast('加载设置失败', 'error');
  }
}

function renderChannels() {
  const container = document.getElementById('channelList');
  if (!availableChannels.length) {
    container.innerHTML = '<div style="text-align:center;padding:20px;color:#999;">暂无可用通知渠道</div>';
    return;
  }
  
  html = '';
  availableChannels.forEach(ch => {
    const isEnabled = config.enabled_channels.includes(ch.name);
    const chConfig = config.channel_configs[ch.name] || {};
    
    html += `<div class="channel-item ${isEnabled ? '' : 'disabled'}">`;
    html += `<div class="channel-switch"><input type="checkbox" ${isEnabled ? 'checked' : ''} onchange="toggleChannel('${ch.name}', this.checked)"></div>`;
    html += `<div class="channel-info">`;
    html += `<div class="channel-label">${ch.label}</div>`;
    
    if (ch.config_fields && ch.config_fields.length) {
      html += `<div class="channel-config ${isEnabled ? 'show' : ''}" id="config_${ch.name}">`;
      ch.config_fields.forEach(field => {
        html += `<div class="form-group">`;
        html += `<label>${field.label}${field.required ? ' <span style="color:#ff4d4f;">*</span>' : ''}</label>`;
        html += `<input type="${field.type || 'text'}" id="${ch.name}_${field.key}" placeholder="${field.placeholder || ''}" value="${chConfig[field.key] || ''}" onchange="updateChannelConfig('${ch.name}', '${field.key}', this.value)">`;
        html += `</div>`;
      });
      html += `<div class="channel-test"><button class="btn-test" onclick="testChannel('${ch.name}')" id="testBtn_${ch.name}">🧪 测试连接</button></div>`;
      html += `</div>`;
    } else {
      html += `<div class="channel-desc">✅ 无需额外配置</div>`;
    }
    
    html += `</div></div>`;
  });
  
  container.innerHTML = html;
}

function toggleChannel(name, enabled) {
  const idx = config.enabled_channels.indexOf(name);
  if (enabled && idx === -1) {
    config.enabled_channels.push(name);
  } else if (!enabled && idx !== -1) {
    config.enabled_channels.splice(idx, 1);
  }
  
  // 更新UI
  const item = document.querySelector(`.channel-item:nth-child(${availableChannels.findIndex(ch => ch.name === name) + 1})`);
  if (item) {
    item.classList.toggle('disabled', !enabled);
  }
  const cfgDiv = document.getElementById(`config_${name}`);
  if (cfgDiv) {
    cfgDiv.classList.toggle('show', enabled);
  }
}

function updateChannelConfig(name, key, value) {
  if (!config.channel_configs[name]) {
    config.channel_configs[name] = {};
  }
  config.channel_configs[name][key] = value;
}

function applyEventSettings() {
  document.getElementById('notify_on_prize').checked = config.notify_on_prize !== false;
  document.getElementById('notify_on_smart_filter').checked = config.notify_on_smart_filter !== false;
  document.getElementById('notify_on_draw_results').checked = config.notify_on_draw_results === true;
}

async function testChannel(name) {
  const btn = document.getElementById(`testBtn_${name}`);
  btn.disabled = true;
  btn.textContent = '⏳ 发送中...';
  
  try {
    const res = await fetch(`/auth/api/notification/test/${name}`, { method: 'POST' });
    const data = await res.json();
    if (res.ok) {
      showToast(data.message || '测试成功', 'success');
    } else {
      showToast(data.error || '测试失败', 'error');
    }
  } catch (e) {
    showToast('网络错误', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '🧪 测试连接';
  }
}

async function saveSettings() {
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = '⏳ 保存中...';
  
  config.notify_on_prize = document.getElementById('notify_on_prize').checked;
  config.notify_on_smart_filter = document.getElementById('notify_on_smart_filter').checked;
  config.notify_on_draw_results = document.getElementById('notify_on_draw_results').checked;
  
  try {
    const res = await fetch('/auth/api/notification/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(config),
    });
    const data = await res.json();
    if (res.ok) {
      showToast(data.message || '保存成功', 'success');
    } else {
      showToast(data.error || '保存失败', 'error');
    }
  } catch (e) {
    showToast('网络错误', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '💾 保存设置';
  }
}

function showToast(msg, type) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = `toast ${type} show`;
  setTimeout(() => { toast.classList.remove('show'); }, 3000);
}

document.addEventListener('DOMContentLoaded', loadSettings);
</script>
{% endblock %}
